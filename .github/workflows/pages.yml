name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/keen-dirac-q4spq3]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir _site && cp index.html style.css app.js robots.txt sitemap.xml icon.svg og.png icon-192.png icon-512.png apple-touch-icon.png favicon-32.png favicon.ico manifest.webmanifest google103ca6595b75c1c2.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
